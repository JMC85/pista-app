<style>
  :root{
    --bg: #12132a;
    --panel: #1b1d3d;
    --panel-2: #232650;
    --line: #33366b;
    --text: #f4f2ea;
    --muted: #9ea2cf;
    --amber: #f2a93b;
    --amber-dim: #6b5326;
    --red: #ff5d5d;
    --green: #6fd4a0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% -10%, #23265a 0%, transparent 45%),
      radial-gradient(circle at 100% 0%, #1a1c3f 0%, transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  header{
    padding:28px clamp(20px,5vw,64px) 10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .dot{
    width:11px;height:11px;border-radius:50%;
    background:var(--red);
    box-shadow:0 0 10px 2px rgba(255,93,93,.6);
    animation:pulse 2.4s infinite ease-in-out;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .brand h1{
    font-family:'Archivo Black',sans-serif;
    font-size:22px;
    letter-spacing:.5px;
    margin:0;
  }
  .brand span{color:var(--amber);}
  .settings-btn{
    background:transparent;
    border:1px solid var(--line);
    color:var(--muted);
    padding:8px 14px;
    border-radius:8px;
    font-size:13px;
    font-family:'IBM Plex Mono',monospace;
  }
  main{padding:0 clamp(20px,5vw,64px) 60px;}
  .hero{
    max-width:760px;
    margin:60px auto 40px;
    text-align:center;
  }
  .hero .eyebrow{
    color:var(--amber);
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:14px;
  }
  .hero h2{
    font-family:'Archivo Black',sans-serif;
    font-size:clamp(28px,4.2vw,44px);
    line-height:1.15;
    margin:0 0 14px;
  }
  .hero p{color:var(--muted);font-size:15px;line-height:1.6;margin:0 auto;max-width:520px;}
  .search-row{
    display:flex;
    gap:10px;
    max-width:640px;
    margin:32px auto 0;
  }
  .search-row input[type=text]{
    flex:1;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    padding:16px 18px;
    border-radius:10px;
    font-size:15px;
  }
  .search-row input[type=text]:focus{outline:2px solid var(--amber);border-color:var(--amber);}
  .search-row button{
    background:var(--amber);
    color:#1a1200;
    border:none;
    padding:0 26px;
    border-radius:10px;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
  }
  .search-row button:disabled{opacity:.5;cursor:not-allowed;}
  #status{
    max-width:640px;margin:24px auto 0;text-align:center;color:var(--muted);
    font-family:'IBM Plex Mono',monospace;font-size:13px;min-height:18px;
  }
  #status.error{color:var(--red);}
  .results{
    display:none;
    max-width:1100px;
    margin:44px auto 0;
    grid-template-columns:280px 1fr;
    gap:24px;
  }
  .results.show{display:grid;}
  @media (max-width:760px){.results{grid-template-columns:1fr;}}
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px;
  }
  .panel h3{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 18px;
  }
  .meter-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:22px;}
  .meter{width:170px;height:170px;position:relative;}
  .meter svg{width:100%;height:100%;}
  .meter-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-40%);text-align:center;}
  .meter-label .num{font-family:'Archivo Black',sans-serif;font-size:34px;display:block;}
  .meter-label .tag{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:1px;}
  .stat-row{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:13px;}
  .stat-row:first-of-type{border-top:none;}
  .stat-row .k{color:var(--muted);}
  .stat-row .v{font-family:'IBM Plex Mono',monospace;font-weight:600;}
  .verdict{margin-top:16px;padding:12px 14px;border-radius:8px;font-size:13px;line-height:1.5;background:var(--panel-2);border:1px solid var(--line);}
  .verdict b{color:var(--amber);}
  .video-list{display:flex;flex-direction:column;gap:10px;}
